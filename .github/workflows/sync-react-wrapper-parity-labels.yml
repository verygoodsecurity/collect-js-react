name: Sync React wrapper parity labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync labels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout label script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Upsert parity labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/sync-react-wrapper-parity-labels.sh
